  [[params.socialIcons]]
    name = "Github"
    url = "https://github.com/Babayaga069"

  [[params.socialIcons]]
    name = "Instagram"
    url = "https://www.instagram.com/shindy"

  # [[params.socialIcons]]
  #  name = "LinkedIn"
  #  url = "https://linkedin.com/in/deinprofil"

[params.footer]
  text = "Impressum · Datenschutz"
  hideCopyright = false

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ["title", "permalink", "summary", "content"]

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

