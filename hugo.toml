baseURL = "https://netscope-oversight.pages.dev/"
title = "Netscope-oversight"
theme = "PaperMod"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  ShowShareButtons = true
  ShowReadingTime = true
  defaultTheme = "auto"
  search = true


[params.profileMode]
  enabled = true
  title = "Netscope-oversight"
  #subtitle = "This is subtitle"
  imageUrl = "/img/me-smoke.jpg"
  imageTitle = "Profilbild"
  imageWidth = 120
  imageHeight = 120

[[params.profileMode.buttons]]
  name = "Archive"
  url = "/archive"

[[params.profileMode.buttons]]
  name = "Posts"
  url = "/posts/"

[[params.socialIcons]]
  name = "Github"
  url = "https://github.com/Babayaga069"

[[params.socialIcons]]
  name = "Instagram"
  url = "https://www.instagram.com/shindy"

[[params.socialIcons]]
  name = "LinkedIn"
  url = "https://linkedin.com/in/deinprofil"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ["title", "permalink", "summary", "content"]

[markup.goldmark.renderer]
unsafe = true

