{{ define "main" }}
<div class="main">
  <h1 style="margin-bottom: 2rem;">Tags</h1>
  <div class="terms-tags">
    {{ range $name, $taxonomy := .Site.Taxonomies.tags }}
      <a href="{{ "/tags/" | relLangURL }}{{ $name | urlize }}">{{ $name }} ({{ len $taxonomy }})</a>
    {{ end }}
  </div>
</div>
{{ end }}
